<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark;--cyan:#7be8ff;--panel:rgba(9,18,29,.82);--line:rgba(123,232,255,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -15%,#233d56,#081019 48%,#030609);color:#eefbff;display:flex;justify-content:center;padding:24px}.shell{width:min(920px,100%);text-align:center}.brand{letter-spacing:.16em;font-size:clamp(30px,4vw,46px);margin:5px 0}.muted{color:#9bb3bf}.stage{height:610px;border:1px solid var(--line);border-radius:34px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 24%,rgba(123,232,255,.16),transparent 33%),linear-gradient(180deg,#13263a,#050a10);box-shadow:0 34px 90px rgba(0,0,0,.48)}#avatarCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}.grid{pointer-events:none;position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,#000 45%,#000)}.glow{pointer-events:none;position:absolute;left:50%;top:8%;transform:translateX(-50%);width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(123,232,255,.12),transparent 68%);filter:blur(2px)}.avatar-badge{position:absolute;top:18px;left:18px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(5,12,20,.55);font-size:12px;color:#b9d8e4;backdrop-filter:blur(12px)}.status{margin:18px 0 10px;font-weight:800}.transcript{min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:1.08rem;line-height:1.6;text-align:left;backdrop-filter:blur(16px)}.start{margin-top:18px;border:1px solid rgba(123,232,255,.25);border-radius:999px;padding:15px 28px;background:linear-gradient(180deg,#17849b,#0b6579);color:white;font-weight:800;cursor:pointer;min-width:220px}.start.active{background:linear-gradient(180deg,#a83f4a,#742832)}.voice-badge{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#a9c5d0}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950}.dot.offline{background:#da3633}.approval{text-align:left;margin-top:18px}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}@media(max-width:720px){.stage{height:520px}}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body><div class="shell">
  <h1 class="brand">KUPPA AI</h1><p class="muted">Your personal digital human. Think with you, act only with approval.</p>
  <div class="stage" id="stage"><canvas id="avatarCanvas"></canvas><div class="glow"></div><div class="grid"></div><div class="avatar-badge" id="avatarBadge">Loading 3D avatar…</div></div>
  <div class="status" id="status">Ready</div><div class="transcript" id="transcript">Press Start conversation, allow microphone access, and speak naturally.</div>
  <div class="voice-badge"><span class="dot" id="voiceDot"></span><span id="voiceStatus">KUPPA neural voice required</span></div><br/>
  <button class="start" id="startButton">Start conversation</button><div class="approval" id="approvals"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

let recognition=null,active=false,listening=false,busy=false,currentAudio=null,avatarRoot=null,headBone=null,neckBone=null;
let avatarState='idle',morphMeshes=[],blinkValue=0,nextBlink=performance.now()+2200;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const canvas=document.getElementById('avatarCanvas'),stage=document.getElementById('stage'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript'),startButton=document.getElementById('startButton'),voiceStatus=document.getElementById('voiceStatus'),voiceDot=document.getElementById('voiceDot'),avatarBadge=document.getElementById('avatarBadge');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,1.48,3.05);camera.lookAt(0,1.32,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight(0xc9efff,0x17202b,2.2));const key=new THREE.DirectionalLight(0xffe2cf,3.2);key.position.set(2,3,3);scene.add(key);const rim=new THREE.DirectionalLight(0x7be8ff,2.0);rim.position.set(-3,2,-2);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(1.35,64),new THREE.MeshBasicMaterial({color:0x102f3a,transparent:true,opacity:.26}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.39;scene.add(floor);

const DEFAULT_AVATAR='https://models.readyplayer.me/6185a4acfb622cf1cdc49348.glb?quality=high&morphTargets=ARKit,Oculus%20Visemes';
const AVATAR_URL=localStorage.getItem('kuppa.avatar.url')||DEFAULT_AVATAR;
new GLTFLoader().load(AVATAR_URL,gltf=>{avatarRoot=gltf.scene;avatarRoot.scale.setScalar(1.12);avatarRoot.position.set(0,-1.38,0);scene.add(avatarRoot);avatarRoot.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;if(o.morphTargetDictionary&&o.morphTargetInfluences)morphMeshes.push(o)}const n=o.name.toLowerCase();if(!headBone&&n==='head')headBone=o;if(!neckBone&&n==='neck')neckBone=o});avatarBadge.textContent='KUPPA • realtime 3D';},undefined,err=>{console.error(err);avatarBadge.textContent='3D avatar unavailable';});

function setMorph(name,value){for(const mesh of morphMeshes){const i=mesh.morphTargetDictionary?.[name];if(i!==undefined)mesh.morphTargetInfluences[i]=THREE.MathUtils.lerp(mesh.morphTargetInfluences[i]||0,value,.35)}}
function animate(t){requestAnimationFrame(animate);const sec=t*.001;if(avatarRoot){avatarRoot.position.y=-1.38+Math.sin(sec*1.2)*.008;if(headBone){const listen=avatarState==='listening'?Math.sin(sec*2.2)*.045:0;const think=avatarState==='thinking'?-0.05:0;headBone.rotation.y=THREE.MathUtils.lerp(headBone.rotation.y,listen+think,.05);headBone.rotation.x=THREE.MathUtils.lerp(headBone.rotation.x,avatarState==='thinking'?.035:0,.05)}if(t>nextBlink){blinkValue=1;nextBlink=t+2200+Math.random()*2600}blinkValue=Math.max(0,blinkValue-.14);setMorph('eyeBlinkLeft',blinkValue);setMorph('eyeBlinkRight',blinkValue);setMorph('eyesClosed',blinkValue);const talk=avatarState==='speaking'?(0.13+Math.abs(Math.sin(sec*10.5))*.48):0;setMorph('jawOpen',talk);setMorph('mouthOpen',talk);setMorph('viseme_aa',talk*.8);setMorph('mouthSmileLeft',avatarState==='idle'?.06:0);setMorph('mouthSmileRight',avatarState==='idle'?.06:0)}renderer.render(scene,camera)}animate(performance.now());
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();

if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;setState('listening','Listening…')};recognition.onresult=e=>{let t='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}transcript.textContent='You: '+t;if(final&&!busy){recognition.stop();ask(t)}};recognition.onerror=e=>{if(e.error!=='aborted'&&active)setTimeout(listen,700)};recognition.onend=()=>{listening=false;if(active&&!busy)setTimeout(listen,350)}}else{startButton.disabled=true;transcript.textContent='Speech recognition is unavailable in this browser.'}
startButton.addEventListener('click',()=>active?endConversation():startConversation());
function startConversation(){active=true;startButton.textContent='End conversation';startButton.classList.add('active');transcript.textContent='KUPPA: I am listening.';listen()}
function endConversation(){active=false;busy=false;recognition?.stop();if(currentAudio){currentAudio.pause();currentAudio=null}startButton.textContent='Start conversation';startButton.classList.remove('active');setState('idle','Conversation ended')}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}
async function ask(message){const clean=(message||'').trim();if(!clean||busy||!active)return;busy=true;setState('thinking','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');transcript.textContent='KUPPA: '+data.message;setState('speaking','Speaking…');await speak(data.message);await loadApprovals()}catch(e){transcript.textContent='KUPPA: '+e.message;setState('idle','Conversation error')}finally{busy=false;if(active)setTimeout(listen,350)}}
async function speak(text){if(!active)return;const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let detail='';try{detail=(await r.json()).error||''}catch(e){}voiceStatus.textContent='KUPPA neural voice offline';voiceDot.classList.add('offline');throw new Error(detail||'KUPPA neural voice engine is offline.')}const blob=await r.blob();const url=URL.createObjectURL(blob);voiceStatus.textContent='KUPPA neural voice';voiceDot.classList.remove('offline');await new Promise((resolve,reject)=>{const a=new Audio(url);currentAudio=a;a.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;setState('idle','Ready');resolve()};a.onerror=()=>{URL.revokeObjectURL(url);currentAudio=null;reject(new Error('KUPPA neural voice audio playback failed.'))};a.play().catch(reject)})}
function setState(state,label){avatarState=state||'idle';statusEl.textContent=label}
async function loadApprovals(){try{const r=await fetch('/api/actions');const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${esc(x.summary)}</p><button class="approve" data-id="${x.id}" data-op="approve">Approve</button><button class="reject" data-id="${x.id}" data-op="reject">Reject</button></div>`).join('');document.querySelectorAll('.approval-card button').forEach(b=>b.addEventListener('click',()=>decide(b.dataset.id,b.dataset.op)))}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will wait for your explicit execution command.':'Rejected.';transcript.textContent='KUPPA: '+line;setState('speaking','Speaking…');await speak(line);await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
loadApprovals();
</script></body></html>
