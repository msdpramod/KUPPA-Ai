<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark;--cyan:#7ee7ff;--cyan2:#32b7d8;--panel:rgba(9,18,28,.76);--line:rgba(126,231,255,.16)}
    *{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#20364b 0,#0b1119 46%,#05080c 100%);color:#edf8fb;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}.shell{width:min(900px,100%);text-align:center}.brand{font-size:clamp(28px,4vw,44px);letter-spacing:.14em;margin:0 0 6px}.muted{color:#9db2be}.avatar-stage{height:560px;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:34px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 27%,rgba(126,231,255,.12),transparent 28%),linear-gradient(180deg,rgba(17,29,43,.92),rgba(4,8,13,.97));box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 0 80px rgba(126,231,255,.025)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(126,231,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(126,231,255,.045) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,#000 35%,#000)}.halo{position:absolute;width:380px;height:380px;border-radius:50%;top:44px;background:radial-gradient(circle,rgba(126,231,255,.17),rgba(50,183,216,.05) 44%,transparent 70%);filter:blur(1px);animation:halo 5s ease-in-out infinite}.hud-ring{position:absolute;width:430px;height:430px;border-radius:50%;top:18px;border:1px solid rgba(126,231,255,.12);box-shadow:0 0 45px rgba(126,231,255,.08);animation:spin 18s linear infinite}.hud-ring:before,.hud-ring:after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px dashed rgba(126,231,255,.08)}.hud-ring:after{inset:64px}.humanoid{position:relative;width:330px;height:500px;transform-origin:50% 100%;animation:idle 5.5s ease-in-out infinite;filter:drop-shadow(0 24px 30px rgba(0,0,0,.34))}.head-wrap{position:absolute;left:79px;top:28px;width:172px;height:220px;transform-origin:50% 82%;transition:transform .35s ease}.neck{position:absolute;left:139px;top:214px;width:54px;height:76px;background:linear-gradient(90deg,#b98569,#d3a084 45%,#b77b60);border-radius:18px;box-shadow:inset -7px 0 14px rgba(65,30,20,.16)}.face{position:absolute;left:13px;top:18px;width:146px;height:184px;border-radius:47% 47% 43% 43%/39% 39% 61% 61%;background:radial-gradient(circle at 48% 25%,#e7b79a,#cc9274 56%,#ad6f56 100%);box-shadow:inset -16px -16px 28px rgba(91,43,29,.14),inset 10px 8px 18px rgba(255,255,255,.08)}.hair{position:absolute;left:4px;top:4px;width:166px;height:86px;border-radius:62px 62px 26px 30px;background:linear-gradient(145deg,#111820,#202a33 55%,#0c1116);transform:rotate(-2deg);box-shadow:0 8px 15px rgba(0,0,0,.18)}.hair:after{content:"";position:absolute;right:2px;top:40px;width:30px;height:78px;border-radius:0 28px 26px 30px;background:#10171e}.ear{position:absolute;top:86px;width:22px;height:40px;border-radius:50%;background:#bf8367}.ear.left{left:6px}.ear.right{right:6px}.brow{position:absolute;top:75px;width:34px;height:5px;border-radius:999px;background:#3b261d;transition:.25s}.brow.left{left:35px;transform:rotate(-4deg)}.brow.right{right:35px;transform:rotate(4deg)}.eye{position:absolute;top:91px;width:34px;height:17px;border-radius:50%;background:#f4eee8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(35,17,10,.18);transition:.25s}.eye.left{left:33px}.eye.right{right:33px}.iris{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#18232a 20%,#476b70 48%,#243b42 72%);margin:1px auto;position:relative;transition:transform .2s}.iris:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:white;left:3px;top:2px;opacity:.85}.nose{position:absolute;left:76px;top:108px;width:17px;height:34px;border-left:2px solid rgba(91,48,33,.35);border-bottom:2px solid rgba(91,48,33,.22);border-radius:0 0 0 14px}.mouth{position:absolute;left:61px;top:153px;width:48px;height:8px;border-radius:0 0 28px 28px;background:linear-gradient(#8c4b4d,#5d282d);box-shadow:0 2px 4px rgba(70,20,20,.18);transform-origin:center;transition:.16s}.jaw-light{position:absolute;left:28px;right:28px;bottom:7px;height:2px;background:linear-gradient(90deg,transparent,rgba(126,231,255,.35),transparent);opacity:.25}.body{position:absolute;left:38px;top:264px;width:255px;height:242px;border-radius:90px 90px 26px 26px;background:linear-gradient(145deg,#1e3342,#0c1823 48%,#08111a);border:1px solid rgba(126,231,255,.1);box-shadow:inset 0 0 42px rgba(126,231,255,.025)}.shoulder.left,.shoulder.right{position:absolute;top:285px;width:84px;height:142px;border-radius:50px;background:linear-gradient(145deg,#172a38,#0a1520)}.shoulder.left{left:5px;transform:rotate(12deg)}.shoulder.right{right:5px;transform:rotate(-12deg)}.chest-core{position:absolute;left:135px;top:326px;width:62px;height:62px;border-radius:50%;border:1px solid rgba(126,231,255,.52);box-shadow:0 0 30px rgba(126,231,255,.22),inset 0 0 22px rgba(126,231,255,.08)}.chest-core:after{content:"K";position:absolute;inset:0;display:grid;place-items:center;color:var(--cyan);font-weight:800;letter-spacing:.08em;text-shadow:0 0 12px rgba(126,231,255,.7)}.status{margin:18px 0 10px;font-weight:800;letter-spacing:.03em}.transcript{min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:1.08rem;line-height:1.6;text-align:left;backdrop-filter:blur(16px);box-shadow:inset 0 0 26px rgba(126,231,255,.02)}.start{margin-top:18px;border:1px solid rgba(126,231,255,.25);border-radius:999px;padding:15px 26px;background:linear-gradient(180deg,#147f95,#0c6579);color:white;font-weight:800;cursor:pointer;min-width:210px;box-shadow:0 0 24px rgba(50,183,216,.18);transition:.2s}.start:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(50,183,216,.26)}.start.active{background:linear-gradient(180deg,#a33b46,#742832);border-color:rgba(255,130,145,.3);box-shadow:0 0 24px rgba(199,70,84,.18)}.approval{margin-top:18px;text-align:left}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700;cursor:pointer}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}.humanoid.listening .head-wrap{animation:listen 1.3s ease-in-out infinite}.humanoid.listening .iris{transform:translateY(1px)}.humanoid.thinking .head-wrap{transform:rotate(-2deg) translateY(-2px)}.humanoid.thinking .iris{transform:translate(5px,-1px)}.humanoid.thinking .brow.left{transform:rotate(7deg)}.humanoid.thinking .brow.right{transform:rotate(-7deg)}.humanoid.speaking .mouth{animation:talk .16s ease-in-out infinite alternate}.humanoid.speaking .chest-core{animation:pulse .7s ease-in-out infinite}.humanoid.speaking .head-wrap{animation:speakNod 1.8s ease-in-out infinite}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes halo{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.05);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes listen{0%,100%{transform:rotate(0)}50%{transform:rotate(1.4deg) translateY(-2px)}}@keyframes speakNod{0%,100%{transform:rotate(0)}50%{transform:rotate(-1deg) translateY(-2px)}}@keyframes talk{from{height:7px;transform:scaleX(.86)}to{height:23px;transform:scaleX(1.08)}}@keyframes pulse{0%,100%{box-shadow:0 0 28px rgba(126,231,255,.2),inset 0 0 22px rgba(126,231,255,.08)}50%{box-shadow:0 0 50px rgba(126,231,255,.42),inset 0 0 30px rgba(126,231,255,.14)}}@media(max-width:720px){.avatar-stage{height:500px}.humanoid{transform:scale(.9);transform-origin:50% 100%}.shell{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <h1 class="brand">KUPPA AI</h1>
  <p class="muted">A calm, one-on-one humanoid assistant. External actions still need your approval.</p>
  <div class="avatar-stage">
    <div class="grid"></div><div class="halo"></div><div class="hud-ring"></div>
    <div class="humanoid" id="avatar">
      <div class="shoulder left"></div><div class="shoulder right"></div><div class="body"></div><div class="neck"></div><div class="chest-core"></div>
      <div class="head-wrap"><div class="hair"></div><div class="ear left"></div><div class="ear right"></div><div class="face"><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="iris"></div></div><div class="eye right"><div class="iris"></div></div><div class="nose"></div><div class="mouth"></div><div class="jaw-light"></div></div></div>
    </div>
  </div>
  <div class="status" id="status">Ready</div>
  <div class="transcript" id="transcript">Press Start conversation, allow microphone access, and speak naturally.</div>
  <button class="start" id="startButton" onclick="toggleConversation()">Start conversation</button>
  <div class="approval" id="approvals"></div>
</div>
<script>
let recognition=null,active=false,listening=false,busy=false,preferredVoice=null;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript'),startButton=document.getElementById('startButton');

function selectVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=window.speechSynthesis.getVoices();
  const scored=voices.map(v=>({v,score:(/en-IN/i.test(v.lang)?50:0)+(/en-GB/i.test(v.lang)?35:0)+(/en-US/i.test(v.lang)?25:0)+(/Samantha|Google|Microsoft|Natural|Neural|Premium/i.test(v.name)?30:0)})).sort((a,b)=>b.score-a.score);
  preferredVoice=scored[0]?.v||voices[0]||null;
}
selectVoice();if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=selectVoice;

if(SpeechRecognition){
  recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';
  recognition.onstart=()=>{listening=true;setState('listening','Listening…')};
  recognition.onresult=e=>{let text='';let final=false;for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}transcript.textContent='You: '+text;if(final&&!busy){recognition.stop();ask(text)}};
  recognition.onerror=e=>{if(e.error!=='aborted'&&active){setState('','I did not catch that');setTimeout(listen,700)}};
  recognition.onend=()=>{listening=false;if(active&&!busy&&statusEl.textContent!=='Speaking…')setTimeout(listen,350)};
}else{startButton.disabled=true;transcript.textContent='This browser does not support speech recognition. Use Chrome or another compatible browser.'}

function toggleConversation(){active?endConversation():startConversation()}
function startConversation(){active=true;startButton.textContent='End conversation';startButton.classList.add('active');transcript.textContent='KUPPA: I am listening.';window.speechSynthesis?.cancel();listen()}
function endConversation(){active=false;busy=false;recognition?.stop();window.speechSynthesis?.cancel();startButton.textContent='Start conversation';startButton.classList.remove('active');setState('','Conversation ended');transcript.textContent='KUPPA: Conversation ended. Press Start conversation when you want to talk again.'}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}

async function ask(message){
  const clean=(message||'').trim();if(!clean||busy||!active)return;busy=true;setState('thinking','Thinking…');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');transcript.textContent='KUPPA: '+data.message;setState('speaking','Speaking…');await speak(data.message);await loadApprovals()}
  catch(e){transcript.textContent='KUPPA: '+e.message;setState('','Conversation error')}
  finally{busy=false;if(active)setTimeout(listen,350)}
}

function speak(text){return new Promise(resolve=>{if(!active||!('speechSynthesis' in window)){resolve();return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(preferredVoice)u.voice=preferredVoice;u.lang=preferredVoice?.lang||'en-IN';u.rate=.93;u.pitch=.96;u.volume=1;u.onend=resolve;u.onerror=resolve;window.speechSynthesis.speak(u)})}
function setState(cls,label){avatar.className='humanoid'+(cls?' '+cls:'');statusEl.textContent=label}
async function loadApprovals(){try{const r=await fetch('/api/actions');const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${escapeHtml(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will only execute when you explicitly request execution.':'Rejected.';transcript.textContent='KUPPA: '+line;setState('speaking','Speaking…');await speak(line);await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function escapeHtml(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
loadApprovals();
</script>
</body>
</html>
