<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark;--cyan:#77e7ff;--cyan2:#2fb7d7;--panel:rgba(8,16,25,.78);--line:rgba(119,231,255,.16)}
    *{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#21384e 0,#0a1119 44%,#04070b 100%);color:#eef9fb;display:flex;align-items:center;justify-content:center;padding:24px}.shell{width:min(920px,100%);text-align:center}.brand{font-size:clamp(30px,4vw,46px);letter-spacing:.16em;margin:0 0 6px}.muted{color:#9bb0bc}
    .avatar-stage{height:590px;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:36px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,rgba(119,231,255,.14),transparent 26%),linear-gradient(180deg,rgba(19,31,45,.94),rgba(4,8,13,.98));box-shadow:0 34px 100px rgba(0,0,0,.48),inset 0 0 90px rgba(119,231,255,.025)}
    .ambient{position:absolute;inset:0;background:radial-gradient(circle at 25% 35%,rgba(255,193,136,.05),transparent 24%),radial-gradient(circle at 78% 28%,rgba(63,166,255,.07),transparent 23%)}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(119,231,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(119,231,255,.04) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,#000 42%,#000)}
    .halo{position:absolute;width:420px;height:420px;border-radius:50%;top:40px;background:radial-gradient(circle,rgba(119,231,255,.16),rgba(47,183,215,.05) 44%,transparent 70%);animation:halo 5s ease-in-out infinite}.ring{position:absolute;width:470px;height:470px;border-radius:50%;top:12px;border:1px solid rgba(119,231,255,.11);box-shadow:0 0 50px rgba(119,231,255,.06);animation:spin 22s linear infinite}.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(119,231,255,.07)}.ring:before{inset:28px}.ring:after{inset:78px}
    .human{position:relative;width:360px;height:535px;transform-origin:50% 100%;animation:idle 5.8s ease-in-out infinite;filter:drop-shadow(0 28px 34px rgba(0,0,0,.36))}
    .shoulder{position:absolute;top:316px;width:108px;height:190px;border-radius:66px;background:linear-gradient(145deg,#182d3b,#09141d 72%);border:1px solid rgba(119,231,255,.06)}.shoulder.left{left:6px;transform:rotate(10deg)}.shoulder.right{right:6px;transform:rotate(-10deg)}
    .torso{position:absolute;left:48px;top:292px;width:264px;height:250px;border-radius:98px 98px 28px 28px;background:linear-gradient(145deg,#203746 0,#0d1c27 44%,#08111a 100%);border:1px solid rgba(119,231,255,.1);box-shadow:inset 0 0 46px rgba(119,231,255,.03)}
    .collar{position:absolute;left:105px;top:283px;width:150px;height:70px;border-radius:0 0 70px 70px;border-bottom:2px solid rgba(119,231,255,.34);box-shadow:0 8px 20px rgba(0,0,0,.22)}
    .neck{position:absolute;left:151px;top:229px;width:58px;height:86px;background:linear-gradient(90deg,#b77c61,#d5a084 48%,#a96c53);border-radius:20px;box-shadow:inset -8px 0 15px rgba(66,31,21,.15)}
    .head-wrap{position:absolute;left:85px;top:24px;width:190px;height:250px;transform-origin:50% 84%;transition:transform .35s ease}
    .ear{position:absolute;top:98px;width:24px;height:44px;border-radius:50%;background:linear-gradient(#c3896e,#af7258);box-shadow:inset 0 0 7px rgba(75,32,22,.14)}.ear.left{left:2px}.ear.right{right:2px}
    .face{position:absolute;left:17px;top:23px;width:156px;height:202px;border-radius:48% 48% 44% 44%/38% 38% 62% 62%;background:radial-gradient(circle at 42% 22%,#edc0a2 0,#dda485 40%,#c88b70 68%,#aa6c55 100%);box-shadow:inset -18px -18px 32px rgba(76,34,24,.14),inset 11px 9px 18px rgba(255,255,255,.1),0 10px 26px rgba(0,0,0,.15)}
    .temple-light{position:absolute;left:30px;top:52px;width:55px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);filter:blur(5px);pointer-events:none}
    .hair{position:absolute;left:2px;top:0;width:186px;height:105px;border-radius:70px 72px 34px 34px;background:linear-gradient(145deg,#0d141b,#202a34 44%,#0a1016 100%);transform:rotate(-2deg);box-shadow:0 10px 18px rgba(0,0,0,.2)}
    .hair:before{content:"";position:absolute;left:18px;top:-10px;width:64px;height:65px;border-radius:58% 42% 55% 45%;background:linear-gradient(145deg,#1d2731,#0a0f14);transform:rotate(-14deg)}
    .hair:after{content:"";position:absolute;right:2px;top:45px;width:34px;height:82px;border-radius:0 30px 28px 30px;background:#0d141b}
    .brow{position:absolute;top:82px;width:36px;height:6px;border-radius:999px;background:linear-gradient(90deg,#2d1d17,#4a3026);transition:.25s}.brow.left{left:37px;transform:rotate(-4deg)}.brow.right{right:37px;transform:rotate(4deg)}
    .eye{position:absolute;top:99px;width:36px;height:18px;border-radius:50%;background:#f6f0e9;overflow:hidden;box-shadow:inset 0 2px 5px rgba(39,18,11,.17),0 1px 0 rgba(255,255,255,.2);transition:.25s}.eye.left{left:35px}.eye.right{right:35px}
    .iris{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#10181d 18%,#4b6e72 44%,#2d454b 70%);margin:1px auto;position:relative;transition:transform .2s}.iris:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:white;left:3px;top:2px;opacity:.92}
    .nose{position:absolute;left:80px;top:118px;width:19px;height:37px;border-left:2px solid rgba(89,45,31,.28);border-bottom:2px solid rgba(89,45,31,.2);border-radius:0 0 0 14px}
    .cheek{position:absolute;top:121px;width:34px;height:24px;border-radius:50%;background:radial-gradient(circle,rgba(255,168,143,.10),transparent 70%)}.cheek.left{left:28px}.cheek.right{right:28px}
    .mouth{position:absolute;left:65px;top:166px;width:50px;height:9px;border-radius:0 0 30px 30px;background:linear-gradient(#965358,#5d292e);box-shadow:0 2px 4px rgba(70,20,20,.18);transform-origin:center;transition:.16s}.lower-lip{position:absolute;left:70px;top:174px;width:40px;height:5px;border-radius:50%;background:rgba(231,151,147,.18)}
    .jawline{position:absolute;left:34px;right:34px;bottom:12px;height:3px;background:linear-gradient(90deg,transparent,rgba(119,231,255,.24),transparent);opacity:.28}
    .core{position:absolute;left:149px;top:363px;width:64px;height:64px;border-radius:50%;border:1px solid rgba(119,231,255,.55);box-shadow:0 0 32px rgba(119,231,255,.22),inset 0 0 24px rgba(119,231,255,.09)}.core:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(119,231,255,.22)}.core:after{content:"K";position:absolute;inset:0;display:grid;place-items:center;color:var(--cyan);font-weight:900;letter-spacing:.08em;text-shadow:0 0 14px rgba(119,231,255,.7)}
    .status{margin:18px 0 10px;font-weight:800;letter-spacing:.03em}.transcript{min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:1.08rem;line-height:1.6;text-align:left;backdrop-filter:blur(16px);box-shadow:inset 0 0 26px rgba(119,231,255,.02)}
    .start{margin-top:18px;border:1px solid rgba(119,231,255,.25);border-radius:999px;padding:15px 28px;background:linear-gradient(180deg,#16849b,#0b6579);color:white;font-weight:800;cursor:pointer;min-width:220px;box-shadow:0 0 26px rgba(47,183,215,.18);transition:.2s}.start:hover{transform:translateY(-1px);box-shadow:0 0 36px rgba(47,183,215,.28)}.start.active{background:linear-gradient(180deg,#a83f4a,#742832);border-color:rgba(255,130,145,.3)}
    .approval{margin-top:18px;text-align:left}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700;cursor:pointer}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}
    .human.listening .head-wrap{animation:listen 1.35s ease-in-out infinite}.human.listening .iris{transform:translateY(1px)}.human.thinking .head-wrap{transform:rotate(-2deg) translateY(-2px)}.human.thinking .iris{transform:translate(5px,-1px)}.human.thinking .brow.left{transform:rotate(7deg)}.human.thinking .brow.right{transform:rotate(-7deg)}.human.speaking .mouth{animation:talk .16s ease-in-out infinite alternate}.human.speaking .core{animation:pulse .7s ease-in-out infinite}.human.speaking .head-wrap{animation:speakNod 1.9s ease-in-out infinite}
    @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes halo{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.05);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes listen{0%,100%{transform:rotate(0)}50%{transform:rotate(1.3deg) translateY(-2px)}}@keyframes speakNod{0%,100%{transform:rotate(0)}50%{transform:rotate(-1deg) translateY(-2px)}}@keyframes talk{from{height:8px;transform:scaleX(.88)}to{height:24px;transform:scaleX(1.08)}}@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(119,231,255,.2),inset 0 0 24px rgba(119,231,255,.09)}50%{box-shadow:0 0 54px rgba(119,231,255,.42),inset 0 0 32px rgba(119,231,255,.14)}}
    @media(max-width:720px){.avatar-stage{height:520px}.human{transform:scale(.9);transform-origin:50% 100%}.shell{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <h1 class="brand">KUPPA AI</h1>
  <p class="muted">Your personal digital human. External actions still require your approval.</p>
  <div class="avatar-stage">
    <div class="ambient"></div><div class="grid"></div><div class="halo"></div><div class="ring"></div>
    <div class="human" id="avatar">
      <div class="shoulder left"></div><div class="shoulder right"></div><div class="torso"></div><div class="collar"></div><div class="neck"></div><div class="core"></div>
      <div class="head-wrap"><div class="hair"></div><div class="ear left"></div><div class="ear right"></div><div class="face"><div class="temple-light"></div><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="iris"></div></div><div class="eye right"><div class="iris"></div></div><div class="nose"></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div><div class="lower-lip"></div><div class="jawline"></div></div></div>
    </div>
  </div>
  <div class="status" id="status">Ready</div>
  <div class="transcript" id="transcript">Press Start conversation, allow microphone access, and speak naturally.</div>
  <button class="start" id="startButton" onclick="toggleConversation()">Start conversation</button>
  <div class="approval" id="approvals"></div>
</div>
<script>
let recognition=null,active=false,listening=false,busy=false,preferredVoice=null;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript'),startButton=document.getElementById('startButton');
function selectVoice(){if(!('speechSynthesis' in window))return;const voices=window.speechSynthesis.getVoices();const scored=voices.map(v=>({v,score:(/en-IN/i.test(v.lang)?50:0)+(/en-GB/i.test(v.lang)?35:0)+(/en-US/i.test(v.lang)?25:0)+(/Samantha|Daniel|Google|Microsoft|Natural|Neural|Premium/i.test(v.name)?30:0)})).sort((a,b)=>b.score-a.score);preferredVoice=scored[0]?.v||voices[0]||null}
selectVoice();if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=selectVoice;
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;setState('listening','Listening…')};recognition.onresult=e=>{let text='';let final=false;for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}transcript.textContent='You: '+text;if(final&&!busy){recognition.stop();ask(text)}};recognition.onerror=e=>{if(e.error!=='aborted'&&active){setState('','I did not catch that');setTimeout(listen,700)}};recognition.onend=()=>{listening=false;if(active&&!busy&&statusEl.textContent!=='Speaking…')setTimeout(listen,350)}}else{startButton.disabled=true;transcript.textContent='This browser does not support speech recognition. Use Chrome or another compatible browser.'}
function toggleConversation(){active?endConversation():startConversation()}
function startConversation(){active=true;startButton.textContent='End conversation';startButton.classList.add('active');transcript.textContent='KUPPA: I am listening.';window.speechSynthesis?.cancel();listen()}
function endConversation(){active=false;busy=false;recognition?.stop();window.speechSynthesis?.cancel();startButton.textContent='Start conversation';startButton.classList.remove('active');setState('','Conversation ended');transcript.textContent='KUPPA: Conversation ended. Press Start conversation when you want to talk again.'}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}
async function ask(message){const clean=(message||'').trim();if(!clean||busy||!active)return;busy=true;setState('thinking','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');transcript.textContent='KUPPA: '+data.message;setState('speaking','Speaking…');await speak(data.message);await loadApprovals()}catch(e){transcript.textContent='KUPPA: '+e.message;setState('','Conversation error')}finally{busy=false;if(active)setTimeout(listen,350)}}
function speak(text){return new Promise(resolve=>{if(!active||!('speechSynthesis' in window)){resolve();return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(preferredVoice)u.voice=preferredVoice;u.lang=preferredVoice?.lang||'en-IN';u.rate=.92;u.pitch=.94;u.volume=1;u.onend=resolve;u.onerror=resolve;window.speechSynthesis.speak(u)})}
function setState(cls,label){avatar.className='human'+(cls?' '+cls:'');statusEl.textContent=label}
async function loadApprovals(){try{const r=await fetch('/api/actions');const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${escapeHtml(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will only execute when you explicitly request execution.':'Rejected.';transcript.textContent='KUPPA: '+line;setState('speaking','Speaking…');await speak(line);await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function escapeHtml(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
loadApprovals();
</script>
</body>
</html>
