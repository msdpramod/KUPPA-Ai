<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark;--cyan:#7be8ff;--panel:rgba(9,18,29,.82);--line:rgba(123,232,255,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -15%,#213a52,#081019 48%,#030609);color:#eefbff;display:flex;justify-content:center;padding:24px}.shell{width:min(900px,100%);text-align:center}.brand{letter-spacing:.16em;font-size:clamp(30px,4vw,46px);margin:5px 0}.muted{color:#9bb3bf}.stage{height:590px;border:1px solid var(--line);border-radius:34px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 24%,rgba(123,232,255,.14),transparent 30%),linear-gradient(180deg,#122233,#050a10);box-shadow:0 34px 90px rgba(0,0,0,.48)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.04) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,#000 42%,#000)}.halo{position:absolute;top:42px;width:410px;height:410px;border-radius:50%;background:radial-gradient(circle,rgba(123,232,255,.17),transparent 68%);animation:halo 5s ease-in-out infinite}.human{width:360px;height:535px;position:relative;transform-origin:50% 100%;animation:idle 5.6s ease-in-out infinite;filter:drop-shadow(0 28px 34px rgba(0,0,0,.38))}.torso{position:absolute;left:48px;top:292px;width:264px;height:250px;border-radius:98px 98px 28px 28px;background:linear-gradient(145deg,#203746,#0c1a25 50%,#071018);border:1px solid rgba(123,232,255,.1)}.shoulder{position:absolute;top:315px;width:108px;height:190px;border-radius:66px;background:linear-gradient(145deg,#192f3e,#08131d)}.shoulder.left{left:7px;transform:rotate(10deg)}.shoulder.right{right:7px;transform:rotate(-10deg)}.neck{position:absolute;left:151px;top:229px;width:58px;height:86px;background:linear-gradient(90deg,#b7795f,#d8a589 48%,#aa6a52);border-radius:20px}.head{position:absolute;left:85px;top:24px;width:190px;height:250px;transform-origin:50% 84%;transition:.3s}.face{position:absolute;left:17px;top:23px;width:156px;height:202px;border-radius:48% 48% 44% 44%/38% 38% 62% 62%;background:radial-gradient(circle at 42% 22%,#efc2a4,#dda485 40%,#c98b70 70%,#aa6c55);box-shadow:inset -18px -18px 32px rgba(76,34,24,.14),inset 11px 9px 18px rgba(255,255,255,.1)}.hair{position:absolute;left:2px;top:0;width:186px;height:105px;border-radius:70px 72px 34px 34px;background:linear-gradient(145deg,#0c141b,#222d37 44%,#090f15);transform:rotate(-2deg)}.hair:before{content:"";position:absolute;left:18px;top:-10px;width:65px;height:66px;border-radius:58% 42% 55% 45%;background:linear-gradient(145deg,#202b35,#090f14);transform:rotate(-14deg)}.ear{position:absolute;top:98px;width:24px;height:44px;border-radius:50%;background:#be8267}.ear.left{left:2px}.ear.right{right:2px}.brow{position:absolute;top:82px;width:36px;height:6px;border-radius:999px;background:#3d271e}.brow.left{left:37px}.brow.right{right:37px}.eye{position:absolute;top:99px;width:36px;height:18px;border-radius:50%;background:#f6f0e9;overflow:hidden}.eye.left{left:35px}.eye.right{right:35px}.iris{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#10181d 18%,#4c7075 45%,#2d454b 70%);margin:1px auto;position:relative;transition:.2s}.iris:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:white;left:3px;top:2px}.nose{position:absolute;left:80px;top:118px;width:19px;height:37px;border-left:2px solid rgba(89,45,31,.28);border-bottom:2px solid rgba(89,45,31,.2);border-radius:0 0 0 14px}.mouth{position:absolute;left:65px;top:166px;width:50px;height:9px;border-radius:0 0 30px 30px;background:linear-gradient(#965358,#5d292e);transform-origin:center}.core{position:absolute;left:149px;top:363px;width:64px;height:64px;border-radius:50%;border:1px solid rgba(123,232,255,.55);box-shadow:0 0 32px rgba(123,232,255,.22),inset 0 0 24px rgba(123,232,255,.09)}.core:after{content:"K";position:absolute;inset:0;display:grid;place-items:center;color:var(--cyan);font-weight:900;text-shadow:0 0 14px rgba(123,232,255,.7)}.human.listening .head{animation:listen 1.35s ease-in-out infinite}.human.thinking .head{transform:rotate(-2deg) translateY(-2px)}.human.thinking .iris{transform:translate(5px,-1px)}.human.speaking .mouth{animation:talk .15s ease-in-out infinite alternate}.human.speaking .core{animation:pulse .7s ease-in-out infinite}.status{margin:18px 0 10px;font-weight:800}.transcript{min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:1.08rem;line-height:1.6;text-align:left;backdrop-filter:blur(16px)}.start{margin-top:18px;border:1px solid rgba(123,232,255,.25);border-radius:999px;padding:15px 28px;background:linear-gradient(180deg,#17849b,#0b6579);color:white;font-weight:800;cursor:pointer;min-width:220px}.start.active{background:linear-gradient(180deg,#a83f4a,#742832)}.voice-badge{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#a9c5d0}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950}.approval{text-align:left;margin-top:18px}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes halo{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.05);opacity:1}}@keyframes listen{0%,100%{transform:rotate(0)}50%{transform:rotate(1.3deg) translateY(-2px)}}@keyframes talk{from{height:8px;transform:scaleX(.88)}to{height:24px;transform:scaleX(1.08)}}@keyframes pulse{50%{box-shadow:0 0 55px rgba(123,232,255,.44),inset 0 0 32px rgba(123,232,255,.14)}}@media(max-width:720px){.stage{height:520px}.human{transform:scale(.9);transform-origin:50% 100%}}
  </style>
</head>
<body><div class="shell">
  <h1 class="brand">KUPPA AI</h1><p class="muted">Your personal digital human. Think with you, act only with approval.</p>
  <div class="stage"><div class="grid"></div><div class="halo"></div><div class="human" id="avatar"><div class="shoulder left"></div><div class="shoulder right"></div><div class="torso"></div><div class="neck"></div><div class="core"></div><div class="head"><div class="hair"></div><div class="ear left"></div><div class="ear right"></div><div class="face"><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="iris"></div></div><div class="eye right"><div class="iris"></div></div><div class="nose"></div><div class="mouth"></div></div></div></div></div>
  <div class="status" id="status">Ready</div><div class="transcript" id="transcript">Press Start conversation, allow microphone access, and speak naturally.</div>
  <div class="voice-badge"><span class="dot"></span><span id="voiceStatus">KUPPA neural voice preferred</span></div><br/>
  <button class="start" id="startButton" onclick="toggleConversation()">Start conversation</button><div class="approval" id="approvals"></div>
</div>
<script>
let recognition=null,active=false,listening=false,busy=false,currentAudio=null;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript'),startButton=document.getElementById('startButton'),voiceStatus=document.getElementById('voiceStatus');
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;setState('listening','Listening…')};recognition.onresult=e=>{let t='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}transcript.textContent='You: '+t;if(final&&!busy){recognition.stop();ask(t)}};recognition.onerror=e=>{if(e.error!=='aborted'&&active)setTimeout(listen,700)};recognition.onend=()=>{listening=false;if(active&&!busy)setTimeout(listen,350)}}else{startButton.disabled=true;transcript.textContent='Speech recognition is unavailable in this browser.'}
function toggleConversation(){active?endConversation():startConversation()}
function startConversation(){active=true;startButton.textContent='End conversation';startButton.classList.add('active');transcript.textContent='KUPPA: I am listening.';listen()}
function endConversation(){active=false;busy=false;recognition?.stop();if(currentAudio){currentAudio.pause();currentAudio=null}window.speechSynthesis?.cancel();startButton.textContent='Start conversation';startButton.classList.remove('active');setState('','Conversation ended')}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}
async function ask(message){const clean=(message||'').trim();if(!clean||busy||!active)return;busy=true;setState('thinking','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');transcript.textContent='KUPPA: '+data.message;setState('speaking','Speaking…');await speak(data.message);await loadApprovals()}catch(e){transcript.textContent='KUPPA: '+e.message;setState('','Conversation error')}finally{busy=false;if(active)setTimeout(listen,350)}}
async function speak(text){if(!active)return;try{const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error('neural voice unavailable');const blob=await r.blob();const url=URL.createObjectURL(blob);await new Promise(resolve=>{const a=new Audio(url);currentAudio=a;voiceStatus.textContent='KUPPA neural voice';a.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;resolve()};a.onerror=()=>{URL.revokeObjectURL(url);currentAudio=null;resolve()};a.play().catch(resolve)});return}catch(e){voiceStatus.textContent='Browser voice fallback';await browserSpeak(text)}}
function browserSpeak(text){return new Promise(resolve=>{if(!('speechSynthesis' in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/Samantha|female|Zira|Karen|Moira|Tessa/i.test(v.name))||voices.find(v=>/^en/i.test(v.lang))||null;u.lang=u.voice?.lang||'en-IN';u.rate=.94;u.pitch=1.05;u.onend=resolve;u.onerror=resolve;speechSynthesis.cancel();speechSynthesis.speak(u)})}
function setState(cls,label){avatar.className='human'+(cls?' '+cls:'');statusEl.textContent=label}
async function loadApprovals(){try{const r=await fetch('/api/actions');const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${esc(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will wait for your explicit execution command.':'Rejected.';transcript.textContent='KUPPA: '+line;setState('speaking','Speaking…');await speak(line);await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
loadApprovals();
</script></body></html>
