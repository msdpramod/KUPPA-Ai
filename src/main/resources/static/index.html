<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KUPPA AI</title>
<style>
:root{color-scheme:dark;--bg:#05090e;--panel:#0b141e;--panel2:#101b27;--line:rgba(123,232,255,.16);--cyan:#7be8ff;--text:#eefbff;--muted:#91aab6;--user:#14394a;--ok:#3fb950;--bad:#da3633}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#20384d,#09111a 45%,#030608);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);padding:18px}.app{width:min(980px,100%);margin:auto}.top{text-align:center;margin-bottom:14px}.brand{margin:0;letter-spacing:.15em;font-size:clamp(30px,4vw,46px)}.subtitle{color:var(--muted);margin:6px 0 0}.status-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(7,14,21,.75);font-size:12px;color:#a9c5d0}.dot{width:8px;height:8px;border-radius:50%;background:#667}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.main{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(360px,1.1fr);gap:14px}.avatar-card,.chat-card{border:1px solid var(--line);border-radius:26px;background:rgba(8,15,23,.86);overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.35)}.avatar-stage{height:520px;position:relative;background:radial-gradient(circle at 50% 28%,rgba(123,232,255,.14),transparent 32%),linear-gradient(180deg,#122233,#050a10)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.035) 1px,transparent 1px);background-size:36px 36px}#avatar3d{position:absolute;inset:0;width:100%;height:100%}.avatar-msg{position:absolute;top:14px;left:14px;right:14px;text-align:center;font-size:12px;color:#bfefff;background:rgba(4,10,15,.68);border:1px solid var(--line);border-radius:999px;padding:7px 10px;z-index:3}.avatar-msg.error{color:#ffb8bd}.state{padding:13px 16px;text-align:center;font-weight:800;border-top:1px solid var(--line)}.mic-wrap{display:flex;justify-content:center;padding:0 0 16px}.mic{width:70px;height:70px;border-radius:50%;border:1px solid rgba(123,232,255,.35);background:#0d2734;color:white;font-size:27px;cursor:pointer;transition:.2s}.mic:hover{transform:scale(1.03)}.mic.live{background:#0a7185;box-shadow:0 0 0 12px rgba(123,232,255,.07)}.mic.speaking{background:#68436d}.mic:disabled{opacity:.45;cursor:not-allowed}
.chat-card{display:flex;flex-direction:column;min-height:610px}.chat-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:800}.chat{flex:1;min-height:420px;max-height:520px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}.msg{max-width:86%;padding:11px 14px;border-radius:17px;line-height:1.48;white-space:pre-wrap;word-break:break-word}.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:5px}.msg.kuppa{align-self:flex-start;background:var(--panel2);border:1px solid rgba(123,232,255,.10);border-bottom-left-radius:5px}.msg.system{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center}.composer{display:flex;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);border-radius:999px;background:#071019;color:white;padding:13px 16px;font-size:16px;outline:none}.composer input:focus{border-color:rgba(123,232,255,.42)}.composer small{color:var(--muted);white-space:nowrap}.approval{padding:0 12px 12px}.approval-card{border:1px solid var(--line);border-radius:14px;background:#101b27;padding:13px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:7px;font-weight:700;cursor:pointer}.approve{background:#238636;color:white}.reject{background:#da3633;color:white}
@media(max-width:820px){.main{grid-template-columns:1fr}.avatar-stage{height:390px}.chat-card{min-height:520px}.chat{min-height:300px}.composer small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 class="brand">KUPPA AI</h1><p class="subtitle">One-to-one conversation. KUPPA thinks with you and acts only with approval.</p></div>
  <div class="status-row">
    <div class="chip"><span class="dot" id="brainDot"></span><span id="brainStatus">Local brain: waiting</span></div>
    <div class="chip"><span class="dot" id="voiceDot"></span><span id="voiceStatus">Neural voice: checking</span></div>
    <div class="chip"><span class="dot" id="avatarDot"></span><span id="avatarChip">Avatar: checking</span></div>
  </div>
  <div class="main">
    <section class="avatar-card">
      <div class="avatar-stage"><div class="grid"></div><canvas id="avatar3d"></canvas><div class="avatar-msg" id="avatarStatus">Avatar loads independently — chat is ready now.</div></div>
      <div class="state" id="state">Ready</div>
      <div class="mic-wrap"><button class="mic" id="micButton" type="button" aria-label="Start voice conversation">🎙</button></div>
    </section>
    <section class="chat-card">
      <div class="chat-head">Conversation</div>
      <div class="chat" id="chat"><div class="msg kuppa">Hi. I’m KUPPA. Type below or press the microphone to talk.</div></div>
      <div class="approval" id="approvals"></div>
      <div class="composer"><input id="textInput" autocomplete="off" placeholder="Message KUPPA…"/><small>Enter to send</small></div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),input=$('textInput'),stateEl=$('state'),micButton=$('micButton');
const brainDot=$('brainDot'),brainStatus=$('brainStatus'),voiceDot=$('voiceDot'),voiceStatus=$('voiceStatus'),avatarDot=$('avatarDot'),avatarChip=$('avatarChip'),avatarStatus=$('avatarStatus');
let recognition=null,voiceMode=false,listening=false,busy=false,currentAudio=null,currentAudioUrl=null;
let scene,camera,renderer,avatarModel,clock,faceMeshes=[],avatarState='idle',animationStarted=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function dot(el,state){el.classList.remove('ok','bad');if(state)el.classList.add(state)}
function message(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=String(text??'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function setState(s,label){avatarState=s;stateEl.textContent=label;micButton.classList.toggle('live',s==='listening');micButton.classList.toggle('speaking',s==='speaking')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=input.value.trim();if(v&&!busy){input.value='';ask(v,false)}}});
micButton.addEventListener('click',()=>voiceMode?stopVoiceMode():startVoiceMode());

async function ask(text,fromVoice){const clean=String(text||'').trim();if(!clean||busy)return;busy=true;stopListeningOnly();message('user',clean);setState('thinking','Thinking…');input.disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});
    let data={};try{data=await r.json()}catch(e){}
    if(!r.ok)throw new Error(data.error||data.message||('Chat HTTP '+r.status));
    if(!data.message)throw new Error('KUPPA returned an empty response');
    dot(brainDot,'ok');brainStatus.textContent='Local brain: online';message('kuppa',data.message);
    if(voiceMode){setState('speaking','Speaking…');try{await speak(data.message)}catch(e){message('system',e.message)}}else setState('idle','Ready');
    await loadApprovals();
  }catch(e){dot(brainDot,'bad');brainStatus.textContent='Local brain: error';message('kuppa','I could not answer: '+(e.message||e));setState('idle','Conversation error')}
  finally{busy=false;input.disabled=false;if(voiceMode)setTimeout(startListening,300);else input.focus()}
}

async function checkVoice(){try{const r=await fetch('/api/voice/status',{cache:'no-store'});const s=await r.json();if(r.ok&&s.reachable){dot(voiceDot,'ok');voiceStatus.textContent='Neural voice: online'}else{dot(voiceDot,'bad');voiceStatus.textContent='Neural voice: offline'}}catch(e){dot(voiceDot,'bad');voiceStatus.textContent='Neural voice: offline'}}
async function speak(text){const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let detail='';try{const d=await r.json();detail=d.error||d.message||''}catch(e){}dot(voiceDot,'bad');voiceStatus.textContent='Neural voice: offline';throw new Error(detail||'Neural voice is unavailable')}
  const blob=await r.blob();if(!blob.size)throw new Error('Neural voice returned empty audio');
  currentAudioUrl=URL.createObjectURL(blob);dot(voiceDot,'ok');voiceStatus.textContent='Neural voice: online';
  await new Promise((resolve,reject)=>{const a=new Audio(currentAudioUrl);currentAudio=a;a.onended=()=>{cleanupAudio();setState('idle','Ready');resolve()};a.onerror=()=>{cleanupAudio();reject(new Error('Neural voice playback failed'))};a.play().catch(err=>{cleanupAudio();reject(new Error('Browser blocked audio playback: '+err.message))})});
}
function cleanupAudio(){if(currentAudio){currentAudio.pause();currentAudio=null}if(currentAudioUrl){URL.revokeObjectURL(currentAudioUrl);currentAudioUrl=null}}

if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';
  recognition.onstart=()=>{listening=true;setState('listening','Listening…')};
  recognition.onresult=e=>{let text='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}if(final&&text.trim()){listening=false;try{recognition.stop()}catch(ignore){}ask(text,true)}};
  recognition.onerror=e=>{listening=false;if(e.error!=='aborted'){message('system','Microphone: '+e.error);setState('idle','Microphone unavailable');if(e.error==='not-allowed'||e.error==='service-not-allowed')stopVoiceMode(false)}};
  recognition.onend=()=>{listening=false;if(voiceMode&&!busy&&!currentAudio)setTimeout(startListening,350)};
}else{micButton.disabled=true;micButton.textContent='⌨';message('system','Voice recognition is unavailable in this browser. Text chat still works.')}
function startVoiceMode(){if(!recognition)return;voiceMode=true;micButton.setAttribute('aria-label','End voice conversation');message('system','Voice conversation started');startListening()}
function stopVoiceMode(show=true){voiceMode=false;stopListeningOnly();cleanupAudio();setState('idle','Ready');if(show)message('system','Voice conversation ended');micButton.setAttribute('aria-label','Start voice conversation')}
function startListening(){if(!voiceMode||busy||listening||currentAudio||!recognition)return;try{recognition.start()}catch(e){setTimeout(()=>{if(voiceMode&&!listening)startListening()},500)}}
function stopListeningOnly(){if(listening&&recognition){try{recognition.stop()}catch(e){}}listening=false}

async function loadApprovals(){try{const r=await fetch('/api/actions');if(!r.ok)return;const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');$('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${escapeHtml(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){if(busy)return;busy=true;stopListeningOnly();try{const r=await fetch(`/api/actions/${id}/${op}`,{method:'POST'});if(!r.ok)throw new Error('Approval HTTP '+r.status);const line=op==='approve'?'Approved. I will wait for your explicit execution command.':'Rejected.';message('kuppa',line);if(voiceMode){setState('speaking','Speaking…');try{await speak(line)}catch(e){message('system',e.message)}}await loadApprovals()}catch(e){message('system',e.message)}finally{busy=false;if(voiceMode)setTimeout(startListening,300)}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function initAvatar(){if(!window.THREE||!THREE.GLTFLoader){avatarFail('Three.js loader unavailable');return}try{const canvas=$('avatar3d');renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(28,1,.1,100);camera.position.set(0,1.5,3.25);camera.lookAt(0,1.4,0);scene.add(new THREE.HemisphereLight(0xe9f7ff,0x101c28,1.3));const key=new THREE.DirectionalLight(0xfff1e8,1.6);key.position.set(2.5,4,3);scene.add(key);clock=new THREE.Clock();resize();window.addEventListener('resize',resize);startRenderLoop();
  const status=await fetch('/api/avatar/status',{cache:'no-store'}).then(r=>r.json());if(!status.cached){avatarFail(status.error||'Local avatar is not cached yet');return}
  avatarStatus.textContent='Loading local humanoid…';const r=await fetch('/api/avatar/model',{cache:'no-store'});if(!r.ok)throw new Error('Avatar model HTTP '+r.status);const bytes=await r.arrayBuffer();
  await new Promise((resolve,reject)=>new THREE.GLTFLoader().parse(bytes,'',g=>{avatarModel=g.scene;const box=new THREE.Box3().setFromObject(avatarModel),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),scale=2.35/Math.max(size.y,.001);avatarModel.scale.setScalar(scale);avatarModel.position.set(-center.x*scale,-box.min.y*scale-.12,-center.z*scale);scene.add(avatarModel);faceMeshes=[];avatarModel.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary)faceMeshes.push(o)});resolve()},e=>reject(e)));
  dot(avatarDot,'ok');avatarChip.textContent='Avatar: online';avatarStatus.textContent='KUPPA humanoid online';avatarStatus.classList.remove('error');
  }catch(e){avatarFail(e.message||String(e))}}
function avatarFail(reason){dot(avatarDot,'bad');avatarChip.textContent='Avatar: unavailable';avatarStatus.textContent='Avatar unavailable — conversation still works';avatarStatus.title=reason;avatarStatus.classList.add('error')}
function resize(){if(!renderer||!camera)return;const c=renderer.domElement,w=c.clientWidth||c.parentElement.clientWidth,h=c.clientHeight||c.parentElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function morph(names,value){for(const m of faceMeshes){const d=m.morphTargetDictionary||{},i=m.morphTargetInfluences||[];for(const n of names)if(d[n]!==undefined)i[d[n]]=value}}
function startRenderLoop(){if(animationStarted)return;animationStarted=true;requestAnimationFrame(render)}
function render(){if(!renderer||!scene||!camera)return;const t=clock?clock.getElapsedTime():0;if(avatarModel){avatarModel.rotation.y=avatarState==='listening'?Math.sin(t*1.5)*.025:avatarState==='thinking'?.03+Math.sin(t*.8)*.01:Math.sin(t*.4)*.006;const talk=avatarState==='speaking'?(.12+Math.abs(Math.sin(t*10))*.55):0;morph(['jawOpen','viseme_aa','mouthOpen'],talk);morph(['eyeBlinkLeft','eyeBlinkRight'],Math.sin(t*.7)>0.996?1:0)}renderer.render(scene,camera);requestAnimationFrame(render)}

checkVoice();initAvatar();loadApprovals();input.focus();
</script>
</body>
</html>
