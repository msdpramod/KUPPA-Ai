<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:28px 16px 60px;background:radial-gradient(circle at top,#18202b,#0d1117 55%);color:#e6edf3}
    h1,h2,p{margin-top:0}.muted{color:#8b949e}.status{font-weight:700}
    .layout{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px;align-items:start}.card{background:rgba(22,27,34,.94);border:1px solid #30363d;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 14px 40px rgba(0,0,0,.18)}
    .avatar-card{text-align:center;position:sticky;top:18px;overflow:hidden}.avatar-stage{height:430px;display:flex;align-items:flex-end;justify-content:center;position:relative;border-radius:18px;background:linear-gradient(180deg,#111827,#0d1117);overflow:hidden}
    .halo{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.18),transparent 68%);top:34px;animation:breathe 4s ease-in-out infinite}
    .person{position:relative;width:230px;height:360px;transform-origin:50% 100%;animation:idle 5s ease-in-out infinite}.head{position:absolute;left:49px;top:18px;width:132px;height:162px;border-radius:48% 48% 44% 44%/42% 42% 58% 58%;background:linear-gradient(145deg,#d8a47f,#b97855);box-shadow:inset -14px -12px 28px rgba(79,41,24,.2)}
    .hair{position:absolute;left:45px;top:8px;width:140px;height:72px;border-radius:70px 70px 28px 28px;background:#171717;transform:rotate(-2deg)}.hair:after{content:"";position:absolute;right:8px;top:33px;width:26px;height:60px;border-radius:0 22px 20px 22px;background:#171717}
    .ear{position:absolute;top:75px;width:20px;height:38px;border-radius:50%;background:#bd805f}.ear.left{left:39px}.ear.right{right:39px}.eye{position:absolute;top:75px;width:24px;height:10px;border-radius:50%;background:#f6f2ea;overflow:hidden;transition:.2s}.eye.left{left:77px}.eye.right{right:77px}.pupil{width:8px;height:8px;border-radius:50%;background:#20140f;margin:1px auto;transition:.2s}.brow{position:absolute;top:61px;width:30px;height:5px;border-radius:8px;background:#38251b;transition:.25s}.brow.left{left:72px;transform:rotate(-5deg)}.brow.right{right:72px;transform:rotate(5deg)}
    .nose{position:absolute;left:108px;top:96px;width:14px;height:24px;border-left:2px solid rgba(92,48,30,.38);border-bottom:2px solid rgba(92,48,30,.25);border-radius:0 0 0 12px}.mouth{position:absolute;left:96px;top:128px;width:38px;height:8px;border-radius:0 0 22px 22px;background:#6d2d2d;transition:.1s;transform-origin:center}.neck{position:absolute;left:91px;top:160px;width:48px;height:50px;background:#b97855;border-radius:10px}.torso{position:absolute;left:27px;top:196px;width:176px;height:170px;border-radius:55px 55px 20px 20px;background:linear-gradient(145deg,#243247,#131c2a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}.chest-mark{position:absolute;left:92px;top:238px;width:46px;height:46px;border-radius:50%;border:2px solid #58a6ff;box-shadow:0 0 24px rgba(88,166,255,.45)}
    .person.listening .head{animation:nod 1.1s ease-in-out infinite}.person.thinking .pupil{transform:translateX(4px)}.person.thinking .brow.left{transform:rotate(9deg)}.person.thinking .brow.right{transform:rotate(-9deg)}.person.speaking .mouth{animation:talk .18s ease-in-out infinite alternate}.person.speaking .halo{animation:none}.person.happy .mouth{height:13px;border-radius:0 0 28px 28px}.person.concerned .brow.left{transform:rotate(14deg)}.person.concerned .brow.right{transform:rotate(-14deg)}
    .avatar-status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 11px;border-radius:999px;background:#0d1117;border:1px solid #30363d;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 12px currentColor}
    textarea{width:100%;min-height:120px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:12px;padding:13px;resize:vertical}button{border:0;border-radius:10px;padding:10px 14px;margin:5px 5px 5px 0;cursor:pointer;font-weight:700}.primary{background:#238636;color:white}.danger{background:#da3633;color:white}.neutral{background:#30363d;color:white}.voice{background:#1f6feb;color:white}.voice.active{outline:3px solid rgba(88,166,255,.25)}code{white-space:pre-wrap}.controls{display:flex;flex-wrap:wrap;align-items:center}.reply-text{font-size:1.05rem;line-height:1.6}
    @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes breathe{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.04);opacity:1}}@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}@keyframes talk{from{height:6px;transform:scaleX(.85)}to{height:20px;transform:scaleX(1.08)}}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.avatar-card{position:relative;top:auto}.avatar-stage{height:360px}.person{transform:scale(.86);transform-origin:50% 100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <h1>KUPPA AI</h1>
  <p class="muted">Think like me. Act only with my approval.</p>
  <div class="layout">
    <section class="card avatar-card" aria-label="KUPPA AI avatar">
      <div class="avatar-stage">
        <div class="halo"></div>
        <div class="person" id="avatar">
          <div class="hair"></div><div class="ear left"></div><div class="ear right"></div><div class="head"></div>
          <div class="brow left"></div><div class="brow right"></div>
          <div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div>
          <div class="nose"></div><div class="mouth"></div><div class="neck"></div><div class="torso"></div><div class="chest-mark"></div>
        </div>
      </div>
      <div class="avatar-status"><span class="dot"></span><span id="avatarStatus">Ready</span></div>
      <p class="muted" style="margin-top:12px">Voice uses your browser's speech features. Text controls always remain available.</p>
    </section>

    <main>
      <div class="card">
        <textarea id="message" placeholder="Talk or type to KUPPA AI..." aria-label="Message to KUPPA AI"></textarea>
        <div class="controls">
          <button class="primary" onclick="chat()">Send</button>
          <button class="voice" id="micButton" onclick="toggleListening()">🎙 Speak</button>
          <button class="neutral" onclick="stopVoice()">Stop voice</button>
        </div>
      </div>
      <div id="reply"></div>
      <h2>Approval Inbox</h2>
      <div id="actions"></div>
    </main>
  </div>
<script>
let recognition=null;let listening=false;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang=navigator.language||'en-IN';recognition.onstart=()=>{listening=true;setAvatar('listening','Listening…');document.getElementById('micButton').classList.add('active')};recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;document.getElementById('message').value=text;if(e.results[e.results.length-1].isFinal)setAvatar('thinking','Heard you')};recognition.onerror=()=>setAvatar('concerned','Could not hear clearly');recognition.onend=()=>{listening=false;document.getElementById('micButton').classList.remove('active');if(document.getElementById('avatarStatus').textContent==='Listening…')setAvatar('','Ready')}}else{document.getElementById('micButton').disabled=true;document.getElementById('micButton').title='Speech recognition is not supported in this browser'}

async function req(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function chat(){const box=document.getElementById('message');const message=box.value.trim();if(!message)return;try{setAvatar('thinking','Thinking…');const r=await req('/api/chat',{method:'POST',body:JSON.stringify({message})});document.getElementById('reply').innerHTML=`<div class="card"><b>KUPPA AI</b><p class="reply-text">${esc(r.message)}</p></div>`;setAvatar('speaking','Speaking…');speak(r.message);load()}catch(e){setAvatar('concerned','Something went wrong');alert(e.message)}}
async function decision(id,op){try{setAvatar('thinking',op==='approve'?'Recording your approval…':'Updating action…');await req(`/api/actions/${id}/${op}`,{method:'POST'});setAvatar(op==='reject'?'concerned':'happy',op==='approve'?'Approved by you':op==='reject'?'Rejected by you':'Action updated');load()}catch(e){setAvatar('concerned','Action failed');alert(e.message)}}
async function load(){try{const a=await req('/api/actions');document.getElementById('actions').innerHTML=a.map(x=>`<div class="card"><div class="status">${esc(x.status)} · ${esc(x.riskLevel)}</div><h3>${esc(x.summary)}</h3><p>${esc(x.reason)}</p><code>${esc(x.payload)}</code><div>${x.status==='PENDING_APPROVAL'?`<button class="primary" onclick="decision('${x.id}','approve')">Approve</button><button class="danger" onclick="decision('${x.id}','reject')">Reject</button>`:''}${x.status==='APPROVED'?`<button class="neutral" onclick="decision('${x.id}','execute')">Execute approved action</button>`:''}</div></div>`).join('')||'<p class="muted">No proposed actions.</p>'}catch(e){document.getElementById('actions').innerHTML='<p class="muted">Could not load actions.</p>'}}
function setAvatar(state,label){const a=document.getElementById('avatar');a.className='person'+(state?' '+state:'');document.getElementById('avatarStatus').textContent=label||'Ready'}
function toggleListening(){if(!recognition)return;if(listening){recognition.stop();return}window.speechSynthesis?.cancel();recognition.start()}
function speak(text){if(!('speechSynthesis' in window)){setAvatar('','Ready');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=navigator.language||'en-IN';u.rate=.98;u.pitch=1;u.onend=()=>setAvatar('happy','Ready');u.onerror=()=>setAvatar('','Ready');window.speechSynthesis.speak(u)}
function stopVoice(){recognition?.stop();window.speechSynthesis?.cancel();setAvatar('','Ready')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load();
</script>
</body>
</html>
