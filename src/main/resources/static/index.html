<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KUPPA AI</title>
  <style>
    :root{color-scheme:dark;--cyan:#7be8ff;--panel:rgba(9,18,29,.82);--line:rgba(123,232,255,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -15%,#213a52,#081019 48%,#030609);color:#eefbff;display:flex;justify-content:center;padding:24px}.shell{width:min(900px,100%);text-align:center}.brand{letter-spacing:.16em;font-size:clamp(30px,4vw,46px);margin:5px 0}.muted{color:#9bb3bf}.stage{height:590px;border:1px solid var(--line);border-radius:34px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 24%,rgba(123,232,255,.14),transparent 30%),linear-gradient(180deg,#122233,#050a10);box-shadow:0 34px 90px rgba(0,0,0,.48)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.04) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,#000 42%,#000)}#avatar3d{position:absolute;inset:0;width:100%;height:100%;display:block}.avatar-badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;padding:8px 12px;border-radius:999px;background:rgba(3,8,13,.72);border:1px solid var(--line);font-size:12px;color:#bfefff;backdrop-filter:blur(12px)}.avatar-badge.error{color:#ffb8bd;border-color:rgba(255,90,100,.35)}.status{margin:18px 0 10px;font-weight:800}.transcript{min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:1.08rem;line-height:1.6;text-align:left;backdrop-filter:blur(16px)}.start{margin-top:18px;border:1px solid rgba(123,232,255,.25);border-radius:999px;padding:15px 28px;background:linear-gradient(180deg,#17849b,#0b6579);color:white;font-weight:800;cursor:pointer;min-width:220px}.start.active{background:linear-gradient(180deg,#a83f4a,#742832)}.voice-badge{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#a9c5d0}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950}.dot.offline{background:#da3633}.approval{text-align:left;margin-top:18px}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}@media(max-width:720px){.stage{height:520px}}
  </style>
</head>
<body><div class="shell">
  <h1 class="brand">KUPPA AI</h1><p class="muted">Your personal digital human. Think with you, act only with approval.</p>
  <div class="stage"><div class="grid"></div><canvas id="avatar3d"></canvas><div class="avatar-badge" id="avatarStatus">Loading 3D avatar…</div></div>
  <div class="status" id="status">Ready</div><div class="transcript" id="transcript">Press Start conversation, allow microphone access, and speak naturally.</div>
  <div class="voice-badge"><span class="dot" id="voiceDot"></span><span id="voiceStatus">KUPPA neural voice required</span></div><br/>
  <button class="start" id="startButton" onclick="toggleConversation()">Start conversation</button><div class="approval" id="approvals"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
let recognition=null,active=false,listening=false,busy=false,currentAudio=null;
let scene,camera,renderer,avatarModel,clock=new THREE.Clock(),avatarState='idle',faceMeshes=[],blinkTimer=0;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const statusEl=document.getElementById('status'),transcript=document.getElementById('transcript'),startButton=document.getElementById('startButton'),voiceStatus=document.getElementById('voiceStatus'),voiceDot=document.getElementById('voiceDot'),avatarStatus=document.getElementById('avatarStatus');

function initAvatar(){
  const canvas=document.getElementById('avatar3d');
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(28,1,.1,100);camera.position.set(0,1.55,3.2);camera.lookAt(0,1.42,0);
  scene.add(new THREE.HemisphereLight(0xd8f3ff,0x172331,1.3));const key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(2.5,4,3);scene.add(key);const rim=new THREE.DirectionalLight(0x74dfff,.8);rim.position.set(-3,2,-2);scene.add(rim);
  resizeAvatar();window.addEventListener('resize',resizeAvatar);
  if(!THREE.GLTFLoader){avatarStatus.textContent='3D loader unavailable';avatarStatus.classList.add('error');return;}
  const url='https://models.readyplayer.me/KJIXZB.glb?morphTargets=ARKit,Oculus%20Visemes&textureAtlas=1024&textureSizeLimit=1024';
  new THREE.GLTFLoader().load(url,gltf=>{
    avatarModel=gltf.scene;scene.add(avatarModel);
    const box=new THREE.Box3().setFromObject(avatarModel),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
    avatarModel.position.x-=center.x;avatarModel.position.z-=center.z;avatarModel.position.y-=box.min.y;
    const targetHeight=2.25,scale=targetHeight/Math.max(size.y,.001);avatarModel.scale.setScalar(scale);
    faceMeshes=[];avatarModel.traverse(o=>{if(o.isMesh){o.frustumCulled=false;if(o.morphTargetDictionary)faceMeshes.push(o)}});
    avatarStatus.textContent='KUPPA 3D avatar online';
    animateAvatar();
  },xhr=>{if(xhr.total)avatarStatus.textContent='Loading avatar '+Math.round(xhr.loaded/xhr.total*100)+'%';},err=>{console.error(err);avatarStatus.textContent='3D avatar failed to load';avatarStatus.classList.add('error')});
  if(!renderer.setAnimationLoop) animateAvatar();
}
function resizeAvatar(){if(!renderer||!camera)return;const canvas=renderer.domElement,w=canvas.clientWidth||canvas.parentElement.clientWidth,h=canvas.clientHeight||canvas.parentElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function morph(names,value){for(const mesh of faceMeshes){const d=mesh.morphTargetDictionary||{},inf=mesh.morphTargetInfluences||[];for(const n of names){if(d[n]!==undefined)inf[d[n]]=value}}}
function animateAvatar(){if(!renderer||!scene||!camera)return;const t=clock.getElapsedTime();if(avatarModel){avatarModel.position.y=Math.sin(t*1.3)*.008;avatarModel.rotation.y=avatarState==='listening'?Math.sin(t*1.8)*.025:avatarState==='thinking'?.04+Math.sin(t)*.012:Math.sin(t*.45)*.008;const talk=avatarState==='speaking'?(0.18+Math.abs(Math.sin(t*11))*.55):0;morph(['jawOpen','viseme_aa','mouthOpen'],talk);blinkTimer-=.016;if(blinkTimer<=0){morph(['eyeBlinkLeft','eyeBlinkRight'],1);setTimeout(()=>morph(['eyeBlinkLeft','eyeBlinkRight'],0),120);blinkTimer=2.5+Math.random()*3.5}}
  renderer.render(scene,camera);requestAnimationFrame(animateAvatar)
}
function setState(cls,label){avatarState=cls||'idle';statusEl.textContent=label}

if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;setState('listening','Listening…')};recognition.onresult=e=>{let t='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}transcript.textContent='You: '+t;if(final&&!busy){recognition.stop();ask(t)}};recognition.onerror=e=>{if(e.error!=='aborted'&&active)setTimeout(listen,700)};recognition.onend=()=>{listening=false;if(active&&!busy)setTimeout(listen,350)}}else{startButton.disabled=true;transcript.textContent='Speech recognition is unavailable in this browser.'}
function toggleConversation(){active?endConversation():startConversation()}
function startConversation(){active=true;startButton.textContent='End conversation';startButton.classList.add('active');transcript.textContent='KUPPA: I am listening.';listen()}
function endConversation(){active=false;busy=false;recognition?.stop();if(currentAudio){currentAudio.pause();currentAudio=null}startButton.textContent='Start conversation';startButton.classList.remove('active');setState('idle','Conversation ended')}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}
async function ask(message){const clean=(message||'').trim();if(!clean||busy||!active)return;busy=true;setState('thinking','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');transcript.textContent='KUPPA: '+data.message;setState('speaking','Speaking…');await speak(data.message);await loadApprovals()}catch(e){transcript.textContent='KUPPA: '+e.message;setState('idle','Conversation error')}finally{busy=false;if(active)setTimeout(listen,350)}}
async function speak(text){if(!active)return;const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let detail='';try{detail=(await r.json()).error||''}catch(e){}voiceStatus.textContent='KUPPA neural voice offline';voiceDot.classList.add('offline');throw new Error(detail||'KUPPA neural voice engine is offline.')}const blob=await r.blob();const url=URL.createObjectURL(blob);voiceStatus.textContent='KUPPA neural voice';voiceDot.classList.remove('offline');await new Promise((resolve,reject)=>{const a=new Audio(url);currentAudio=a;a.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;setState('idle','Ready');resolve()};a.onerror=()=>{URL.revokeObjectURL(url);currentAudio=null;reject(new Error('KUPPA neural voice audio playback failed.'))};a.play().catch(reject)})}
async function loadApprovals(){try{const r=await fetch('/api/actions');const actions=await r.json();const pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${esc(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will wait for your explicit execution command.':'Rejected.';transcript.textContent='KUPPA: '+line;setState('speaking','Speaking…');await speak(line);await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
initAvatar();loadApprovals();
</script></body></html>
