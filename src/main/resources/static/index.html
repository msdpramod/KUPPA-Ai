<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KUPPA AI</title>
<style>
:root{color-scheme:dark;--cyan:#7be8ff;--line:rgba(123,232,255,.22);--panel:rgba(4,11,18,.74)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#24445e,#071019 52%,#020507);font-family:Inter,system-ui,-apple-system,sans-serif;color:#eefbff;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:18px 22px 4px;text-align:center;pointer-events:none}.brand{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:.18em}.tag{margin:6px 0 0;color:#94adb9;font-size:13px}.stage{position:relative;overflow:hidden;cursor:default;outline:none}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000 0,transparent 74%)}#avatar3d{position:absolute;inset:0;width:100%;height:100%;display:block}.aura{position:absolute;left:50%;top:51%;width:min(46vw,430px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(123,232,255,.13),rgba(123,232,255,.03) 46%,transparent 70%);filter:blur(4px);transition:box-shadow .28s,transform .28s,opacity .28s}.stage[data-state="NOTICED_USER"] .aura{transform:translate(-50%,-50%) scale(1.025);box-shadow:0 0 64px rgba(123,232,255,.12)}.stage[data-state="LISTENING"] .aura{box-shadow:0 0 84px rgba(79,221,255,.24)}.stage[data-state="UNDERSTANDING"] .aura,.stage[data-state="ASKING_VAYU"] .aura,.stage[data-state="THINKING"] .aura{box-shadow:0 0 94px rgba(150,120,255,.2)}.stage[data-state="RESPONDING"] .aura{box-shadow:0 0 88px rgba(113,170,255,.2)}.stage[data-state="SPEAKING"] .aura{box-shadow:0 0 104px rgba(255,132,222,.24)}.stage[data-state="WAITING"] .aura{opacity:.86}.status{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(3,9,14,.72);font-size:12px;color:#c8eff8;backdrop-filter:blur(12px);max-width:88%;text-align:center}.status.error{color:#ffb5ba;border-color:rgba(255,100,110,.32)}.subtitle{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:min(820px,90%);text-align:center;font-size:clamp(18px,2.5vw,28px);line-height:1.42;text-shadow:0 2px 20px rgba(0,0,0,.9);z-index:6;min-height:44px}.speaker{display:block;color:#86eaff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}.mic{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;width:58px;height:58px;border-radius:50%;border:1px solid rgba(123,232,255,.5);background:rgba(6,29,40,.82);color:white;font-size:24px;display:grid;place-items:center;cursor:pointer;transition:.2s}.mic:hover,.mic:focus-visible{transform:translateX(-50%) scale(1.06);outline:2px solid rgba(123,232,255,.55);outline-offset:4px}.stage[data-state="LISTENING"] .mic{background:#08748a;box-shadow:0 0 0 15px rgba(123,232,255,.06)}.stage[data-state="SPEAKING"] .mic{background:#754d78;box-shadow:0 0 0 10px rgba(255,132,222,.06)}.bottom{padding:10px 18px 16px;display:flex;justify-content:center;position:relative;z-index:10}.composer{width:min(780px,94vw);display:flex;align-items:center;background:rgba(5,13,20,.88);border:1px solid var(--line);border-radius:999px;padding:7px 16px;backdrop-filter:blur(14px)}.composer input{flex:1;border:0;outline:0;background:transparent;color:#eefbff;font-size:16px;padding:10px 4px}.composer small{color:#768f9b}.approvals{position:absolute;right:18px;bottom:88px;width:min(330px,86vw);z-index:12}.approval{background:rgba(9,20,29,.95);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:9px}.approval p{margin:7px 0 10px;font-size:13px}.approval button{border:0;border-radius:9px;padding:8px 11px;margin-right:7px;font-weight:700}.yes{background:#238636;color:#fff}.no{background:#b8323d;color:#fff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.top{padding-top:12px}.tag{display:none}.subtitle{bottom:90px}.approvals{right:7%;bottom:150px}.composer small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 class="brand">KUPPA AI</h1><p class="tag">A reactive personal AI — talk naturally or type below.</p></div>
  <main class="stage" id="stage" data-state="IDLE" tabindex="-1" aria-describedby="interactionHelp">
    <div class="grid"></div><div class="aura" id="aura"></div><canvas id="avatar3d"></canvas>
    <div class="status" id="avatarStatus" role="status" aria-live="polite">Avatar starting…</div>
    <div class="subtitle" id="subtitle" aria-live="polite"><span class="speaker">KUPPA</span>I’m here.</div>
    <button class="mic" id="mic" type="button" aria-label="Start voice conversation" aria-pressed="false">🎙</button>
    <div class="approvals" id="approvals"></div>
    <p id="interactionHelp" class="sr-only">Press the microphone to start voice conversation. While KUPPA is speaking, press it again or press Escape to interrupt and speak.</p>
  </main>
  <div class="bottom"><div class="composer"><input id="textInput" aria-label="Message KUPPA" placeholder="Talk to KUPPA…" autocomplete="off"/><small>Enter</small></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const STATES=Object.freeze({IDLE:'IDLE',NOTICED_USER:'NOTICED_USER',LISTENING:'LISTENING',UNDERSTANDING:'UNDERSTANDING',ASKING_VAYU:'ASKING_VAYU',THINKING:'THINKING',RESPONDING:'RESPONDING',SPEAKING:'SPEAKING',WAITING:'WAITING'});
const TRANSITIONS=Object.freeze({IDLE:new Set(['NOTICED_USER','LISTENING','UNDERSTANDING']),NOTICED_USER:new Set(['IDLE','LISTENING','UNDERSTANDING']),LISTENING:new Set(['UNDERSTANDING','IDLE','WAITING']),UNDERSTANDING:new Set(['ASKING_VAYU','IDLE']),ASKING_VAYU:new Set(['THINKING','RESPONDING','IDLE']),THINKING:new Set(['RESPONDING','IDLE']),RESPONDING:new Set(['SPEAKING','WAITING','IDLE']),SPEAKING:new Set(['LISTENING','WAITING','IDLE']),WAITING:new Set(['NOTICED_USER','LISTENING','UNDERSTANDING','IDLE'])});
let state=STATES.IDLE,recognition=null,voiceMode=false,listening=false,busy=false,currentAudio=null,audioCtx=null,analyser=null,sourceNode=null,noticeTimer=null;
let scene,camera,renderer,avatarModel,clock,faceMeshes=[],baseY=0,lookX=0,lookY=0,targetLookX=0,targetLookY=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const stage=document.getElementById('stage'),mic=document.getElementById('mic'),subtitle=document.getElementById('subtitle'),textInput=document.getElementById('textInput'),avatarStatus=document.getElementById('avatarStatus');
const VISUAL_STATE={IDLE:'idle',NOTICED_USER:'noticed',LISTENING:'listening',UNDERSTANDING:'thinking',ASKING_VAYU:'thinking',THINKING:'thinking',RESPONDING:'responding',SPEAKING:'speaking',WAITING:'waiting'};
function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function sayOnScreen(who,text){subtitle.innerHTML=`<span class="speaker">${esc(who)}</span>${esc(text)}`}
function transition(next,label,{force=false}={}){if(!STATES[next])throw new Error('Unknown KUPPA state: '+next);if(next===state){if(label)avatarStatus.textContent=label;return}if(!force&&!TRANSITIONS[state]?.has(next)){console.warn(`Blocked KUPPA state transition ${state} -> ${next}`);return}const previous=state;state=next;stage.dataset.state=next;if(label)avatarStatus.textContent=label;mic.setAttribute('aria-pressed',String(voiceMode));mic.setAttribute('aria-label',next===STATES.SPEAKING?'Interrupt KUPPA and start listening':voiceMode?'Pause voice conversation':'Start voice conversation');stage.dispatchEvent(new CustomEvent('kuppa-state-change',{detail:{from:previous,to:next,visual:VISUAL_STATE[next]}}))}
function markPresence(){if(state!==STATES.IDLE&&state!==STATES.WAITING)return;transition(STATES.NOTICED_USER,'I noticed you');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{if(state===STATES.NOTICED_USER)transition(STATES.IDLE,'Ready')},900)}
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();targetLookX=((e.clientX-r.left)/r.width-.5)*.18;targetLookY=((e.clientY-r.top)/r.height-.5)*-.08;markPresence()});
stage.addEventListener('pointerleave',()=>{targetLookX=0;targetLookY=0});
mic.addEventListener('click',e=>{e.stopPropagation();if(state===STATES.SPEAKING){bargeIn('mic');return}voiceMode?stopVoiceMode():startVoiceMode()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state===STATES.SPEAKING){e.preventDefault();bargeIn('keyboard')}});
textInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const t=textInput.value.trim();if(t&&!busy){textInput.value='';ask(t,false)}}});
async function initAvatar(){try{if(!window.THREE||!THREE.GLTFLoader)throw new Error('Three.js unavailable');const c=document.getElementById('avatar3d');renderer=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(27,1,.1,100);camera.position.set(0,1.52,3.2);camera.lookAt(0,1.4,0);scene.add(new THREE.HemisphereLight(0xe9f7ff,0x0d1720,1.35));const k=new THREE.DirectionalLight(0xffeee4,1.7);k.position.set(2.7,4.1,3);scene.add(k);const r=new THREE.DirectionalLight(0x6de5ff,1);r.position.set(-3,2.2,-2);scene.add(r);resize();window.addEventListener('resize',resize);clock=new THREE.Clock();await loadAvatarIfReady();animate()}catch(e){avatarStatus.textContent='Avatar offline — conversation still works';avatarStatus.classList.add('error');console.error(e)}}
async function loadAvatarIfReady(){const deadline=Date.now()+12000;while(Date.now()<deadline){const r=await fetch('/api/avatar/status',{cache:'no-store'});if(r.ok){const s=await r.json();if(s.cached)break;if(s.error)throw new Error(s.error)}await sleep(700)}const rs=await fetch('/api/avatar/status',{cache:'no-store'});const st=await rs.json();if(!st.cached)throw new Error(st.error||'Local avatar is not cached');const response=await fetch('/api/avatar/model',{cache:'no-store'});if(!response.ok)throw new Error('Avatar model HTTP '+response.status);const bytes=await response.arrayBuffer();await new Promise((resolve,reject)=>new THREE.GLTFLoader().parse(bytes,'',g=>{avatarModel=g.scene;const b=new THREE.Box3().setFromObject(avatarModel),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3()),scale=2.5/Math.max(size.y,.001);avatarModel.scale.setScalar(scale);avatarModel.position.set(-center.x*scale,-b.min.y*scale-.1,-center.z*scale);baseY=avatarModel.position.y;scene.add(avatarModel);avatarModel.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary)faceMeshes.push(o)});avatarStatus.textContent='KUPPA online';avatarStatus.classList.remove('error');resolve()},reject))}
function resize(){if(!renderer)return;const c=renderer.domElement,w=c.clientWidth||innerWidth,h=c.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function morph(names,v){for(const m of faceMeshes){const d=m.morphTargetDictionary||{},i=m.morphTargetInfluences||[];for(const n of names)if(d[n]!==undefined)i[d[n]]=v}}
function audioLevel(){if(!analyser)return 0;const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(a);let sum=0;for(const x of a){const n=(x-128)/128;sum+=n*n}return Math.min(1,Math.sqrt(sum/a.length)*4)}
function animate(){if(!renderer)return;const t=clock.getElapsedTime();lookX+=(targetLookX-lookX)*.06;lookY+=(targetLookY-lookY)*.06;if(avatarModel){avatarModel.rotation.y=lookX+(state===STATES.THINKING?.035:0)+Math.sin(t*.45)*.006;avatarModel.rotation.x=lookY;avatarModel.position.y=baseY+Math.sin(t*1.15)*.008;let talk=0;if(state===STATES.SPEAKING)talk=Math.max(.1,audioLevel());morph(['jawOpen','viseme_aa','mouthOpen'],talk*.8);morph(['mouthSmileLeft','mouthSmileRight'],state===STATES.IDLE?.12:state===STATES.LISTENING?.08:0);morph(['browInnerUp'],state===STATES.THINKING||state===STATES.ASKING_VAYU?.22:0);const blink=(Math.sin(t*.58)>0.997)?1:0;morph(['eyeBlinkLeft','eyeBlinkRight'],blink)}renderer.render(scene,camera);requestAnimationFrame(animate)}
if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;transition(STATES.LISTENING,'Listening',{force:true});sayOnScreen('KUPPA','I’m listening…')};recognition.onresult=e=>{let t='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}if(t)sayOnScreen('YOU',t);if(final&&!busy){transition(STATES.UNDERSTANDING,'Understanding');recognition.stop();ask(t,true)}};recognition.onerror=e=>{listening=false;if(voiceMode&&e.error!=='aborted'){avatarStatus.textContent='Mic: '+e.error;transition(STATES.WAITING,'Voice interrupted',{force:true});setTimeout(listen,800)}};recognition.onend=()=>{listening=false;if(voiceMode&&!busy&&state!==STATES.SPEAKING)setTimeout(listen,300)}}else{avatarStatus.textContent='Voice recognition unavailable — type to KUPPA'}
function startVoiceMode(){if(!recognition){textInput.focus();return}voiceMode=true;mic.setAttribute('aria-pressed','true');listen()}
function stopVoiceMode(){voiceMode=false;recognition?.stop();stopPlayback();transition(STATES.IDLE,'Voice paused',{force:true});sayOnScreen('KUPPA','Voice paused. You can still type to me.')}
function listen(){if(!voiceMode||busy||listening||!recognition||state===STATES.SPEAKING)return;try{recognition.start()}catch(e){}}
function stopPlayback(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}if(sourceNode){try{sourceNode.disconnect()}catch(e){}sourceNode=null}if(analyser){try{analyser.disconnect()}catch(e){}analyser=null}}
function bargeIn(source){stopPlayback();busy=false;voiceMode=true;recognition?.stop();sayOnScreen('KUPPA','Go ahead — I’m listening.');transition(STATES.LISTENING,source==='keyboard'?'Interrupted — listening':'Listening',{force:true});setTimeout(listen,60)}
async function ask(message,fromVoice){const clean=(message||'').trim();if(!clean||busy)return;busy=true;recognition?.stop();sayOnScreen('YOU',clean);transition(STATES.UNDERSTANDING,'Understanding',{force:true});await sleep(90);transition(STATES.ASKING_VAYU,'Asking Vayu');try{const request=fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});transition(STATES.THINKING,'Vayu is thinking');const r=await request;const data=await r.json();if(!r.ok)throw new Error(data.error||'Chat request failed');transition(STATES.RESPONDING,'Preparing response');sayOnScreen('KUPPA',data.message);await loadApprovals();if(fromVoice&&voiceMode){transition(STATES.SPEAKING,'Speaking');await speak(data.message);if(state===STATES.SPEAKING)transition(STATES.WAITING,'Ready')}else transition(STATES.WAITING,'Ready')}catch(e){sayOnScreen('KUPPA',e.message);transition(STATES.IDLE,'Conversation error',{force:true})}finally{busy=false;if(voiceMode&&state!==STATES.SPEAKING)setTimeout(listen,320);else if(!voiceMode)textInput.focus()}}
async function speak(text){const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let d='';try{d=(await r.json()).error||''}catch(e){}throw new Error(d||'Neural voice unavailable')}const blob=await r.blob(),url=URL.createObjectURL(blob);await new Promise(async(resolve,reject)=>{const a=new Audio(url);currentAudio=a;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();sourceNode=audioCtx.createMediaElementSource(a);analyser=audioCtx.createAnalyser();analyser.fftSize=256;sourceNode.connect(analyser);analyser.connect(audioCtx.destination)}catch(e){analyser=null}a.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;analyser=null;sourceNode=null;resolve()};a.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Voice playback failed'))};a.play().catch(reject)})}
async function loadApprovals(){try{const r=await fetch('/api/actions'),items=await r.json(),p=items.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=p.map(x=>`<div class="approval"><b>Approval needed</b><p>${esc(x.summary)}</p><button class="yes" onclick="decide('${x.id}','approve')">Approve</button><button class="no" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){await fetch(`/api/actions/${id}/${op}`,{method:'POST'});sayOnScreen('KUPPA',op==='approve'?'Approved. I’ll wait for your explicit execution command.':'Rejected.');loadApprovals()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
initAvatar();loadApprovals();textInput.focus();
</script>
</body>
</html>
