<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>KUPPA AI</title>
<style>
:root{color-scheme:dark;--cyan:#7be8ff;--panel:rgba(9,18,29,.86);--line:rgba(123,232,255,.18);--user:#14394a;--kuppa:#101b27}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -15%,#213a52,#081019 48%,#030609);color:#eefbff;display:flex;justify-content:center;padding:20px}.shell{width:min(980px,100%)}.top{text-align:center}.brand{letter-spacing:.16em;font-size:clamp(30px,4vw,46px);margin:4px 0}.muted{color:#9bb3bf;margin-top:4px}.stage{height:520px;border:1px solid var(--line);border-radius:30px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 24%,rgba(123,232,255,.14),transparent 30%),linear-gradient(180deg,#122233,#050a10);box-shadow:0 30px 80px rgba(0,0,0,.45);cursor:pointer}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(123,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(123,232,255,.04) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,#000 42%,#000)}#avatar3d{position:absolute;inset:0;width:100%;height:100%;display:block}.badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;padding:8px 12px;border-radius:999px;background:rgba(3,8,13,.74);border:1px solid var(--line);font-size:12px;color:#bfefff;max-width:90%;text-align:center}.badge.error{color:#ffb8bd}.pulse{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:1px solid rgba(123,232,255,.45);background:rgba(12,34,46,.72);display:grid;place-items:center;font-size:25px;z-index:5;box-shadow:0 0 0 0 rgba(123,232,255,.22);transition:.2s}.pulse.live{box-shadow:0 0 0 16px rgba(123,232,255,.06);background:#0c6577}.pulse.speaking{background:#6a466f}.state{text-align:center;margin:14px 0 10px;font-weight:800;color:#d9f7ff}.chat{height:260px;overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.msg{max-width:82%;padding:12px 14px;border-radius:17px;line-height:1.5;text-align:left;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:5px}.msg.kuppa{align-self:flex-start;background:var(--kuppa);border:1px solid rgba(123,232,255,.12);border-bottom-left-radius:5px}.composer{margin-top:12px;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:rgba(7,16,24,.9);padding:6px 8px 6px 18px}.composer input{flex:1;background:transparent;border:0;outline:0;color:#eefbff;font-size:16px;padding:10px 4px}.hint{font-size:12px;color:#829ba7;padding:0 8px}.voice-badge{display:flex;justify-content:center;gap:8px;align-items:center;margin:12px auto 0;width:max-content;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#a9c5d0}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950}.dot.offline{background:#da3633}.approval{margin-top:14px}.approval-card{background:rgba(15,25,35,.94);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.approval-card button{border:0;border-radius:9px;padding:9px 12px;margin-right:8px;font-weight:700}.approve{background:#238636;color:#fff}.reject{background:#da3633;color:#fff}@media(max-width:720px){body{padding:10px}.stage{height:420px}.chat{height:230px}.msg{max-width:92%}.hint{display:none}}
</style>
</head>
<body><div class="shell">
  <div class="top"><h1 class="brand">KUPPA AI</h1><p class="muted">Talk naturally. KUPPA thinks with you and acts only with approval.</p></div>
  <div class="stage" id="stage" title="Click to start or end voice conversation"><div class="grid"></div><canvas id="avatar3d"></canvas><div class="badge" id="avatarStatus">Preparing local humanoid…</div><div class="pulse" id="voicePulse">🎙</div></div>
  <div class="state" id="status">Ready — click the avatar to talk</div>
  <div class="chat" id="chat"><div class="msg kuppa">Hi. I’m KUPPA. Talk to me or type below.</div></div>
  <div class="composer"><input id="textInput" autocomplete="off" placeholder="Message KUPPA…"/><span class="hint">Press Enter</span></div>
  <div class="voice-badge"><span class="dot" id="voiceDot"></span><span id="voiceStatus">KUPPA neural voice required</span></div>
  <div class="approval" id="approvals"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
let recognition=null,active=false,listening=false,busy=false,currentAudio=null;
let scene,camera,renderer,avatarModel,clock,avatarState='idle',faceMeshes=[];
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const statusEl=document.getElementById('status'),chat=document.getElementById('chat'),textInput=document.getElementById('textInput'),voiceStatus=document.getElementById('voiceStatus'),voiceDot=document.getElementById('voiceDot'),avatarStatus=document.getElementById('avatarStatus'),voicePulse=document.getElementById('voicePulse'),stage=document.getElementById('stage');

function addMessage(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function setState(s,label){avatarState=s||'idle';statusEl.textContent=label;voicePulse.classList.toggle('live',s==='listening');voicePulse.classList.toggle('speaking',s==='speaking')}

stage.addEventListener('click',()=>{active?endConversation():startConversation()});
textInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const value=textInput.value.trim();if(value&&!busy){textInput.value='';ask(value,false)}}});

async function initAvatar(){try{if(!window.THREE||!THREE.GLTFLoader)throw new Error('Three.js avatar loader unavailable');const canvas=document.getElementById('avatar3d');renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(28,1,.1,100);camera.position.set(0,1.5,3.25);camera.lookAt(0,1.42,0);scene.add(new THREE.HemisphereLight(0xe9f7ff,0x101c28,1.35));const key=new THREE.DirectionalLight(0xfff1e8,1.65);key.position.set(2.5,4,3);scene.add(key);const rim=new THREE.DirectionalLight(0x6be0ff,.9);rim.position.set(-3,2,-2);scene.add(rim);resizeAvatar();window.addEventListener('resize',resizeAvatar);clock=new THREE.Clock();await waitForAvatarCache();await loadCachedAvatar()}catch(e){throwAvatar(e)}}
async function waitForAvatarCache(){const started=Date.now();while(Date.now()-started<45000){const r=await fetch('/api/avatar/status',{cache:'no-store'});if(!r.ok)throw new Error('Avatar status HTTP '+r.status);const s=await r.json();if(s.cached){avatarStatus.textContent='KUPPA humanoid ready';return}if(s.error)throw new Error(s.error);avatarStatus.textContent='Preparing KUPPA humanoid… '+Math.floor((Date.now()-started)/1000)+'s';await new Promise(res=>setTimeout(res,1000))}throw new Error('Avatar setup did not complete. Check /api/avatar/status.')}
async function loadCachedAvatar(){const response=await fetch('/api/avatar/model',{cache:'no-store'});if(!response.ok){let detail='';try{const data=await response.json();detail=data.error||data.message||JSON.stringify(data)}catch(e){}throw new Error(`Avatar backend HTTP ${response.status}${detail?': '+detail:''}`)}const bytes=await response.arrayBuffer();await new Promise((resolve,reject)=>new THREE.GLTFLoader().parse(bytes,'',gltf=>{try{avatarModel=gltf.scene;const box=new THREE.Box3().setFromObject(avatarModel),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2.35/Math.max(size.y,.001);avatarModel.scale.setScalar(scale);avatarModel.position.x=-center.x*scale;avatarModel.position.z=-center.z*scale;avatarModel.position.y=-box.min.y*scale-.12;scene.add(avatarModel);avatarModel.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary)faceMeshes.push(o)});avatarStatus.textContent='KUPPA humanoid online';avatarStatus.classList.remove('error');animateAvatar();resolve()}catch(e){reject(e)}},e=>reject(new Error('GLB parse failed: '+(e?.message||String(e))))))}
function throwAvatar(e){console.error(e);avatarStatus.textContent='Avatar error: '+(e?.message||String(e));avatarStatus.classList.add('error')}
function resizeAvatar(){if(!renderer||!camera)return;const c=renderer.domElement,w=c.clientWidth||c.parentElement.clientWidth,h=c.clientHeight||c.parentElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function morph(names,value){for(const m of faceMeshes){const d=m.morphTargetDictionary||{},i=m.morphTargetInfluences||[];for(const n of names)if(d[n]!==undefined)i[d[n]]=value}}
function animateAvatar(){if(!renderer)return;const t=clock.getElapsedTime();if(avatarModel){avatarModel.rotation.y=avatarState==='listening'?Math.sin(t*1.6)*.025:avatarState==='thinking'?.035+Math.sin(t*.8)*.01:Math.sin(t*.45)*.006;const talk=avatarState==='speaking'?(0.12+Math.abs(Math.sin(t*10))*.55):0;morph(['jawOpen','viseme_aa','mouthOpen'],talk);morph(['mouthSmileLeft','mouthSmileRight'],avatarState==='idle'?.12:0);const blink=(Math.sin(t*.65)>0.995)?1:0;morph(['eyeBlinkLeft','eyeBlinkRight'],blink)}renderer.render(scene,camera);requestAnimationFrame(animateAvatar)}

if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';recognition.onstart=()=>{listening=true;setState('listening','Listening…')};recognition.onresult=e=>{let t='',final=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=true}if(final&&!busy){recognition.stop();ask(t,true)}};recognition.onerror=e=>{if(e.error!=='aborted'&&active){setState('idle','Mic error: '+e.error);setTimeout(listen,800)}};recognition.onend=()=>{listening=false;if(active&&!busy)setTimeout(listen,350)}}else{voicePulse.textContent='⌨';statusEl.textContent='Voice recognition unavailable — text chat still works.'}
function startConversation(){if(!recognition){textInput.focus();return}active=true;addMessage('kuppa','Voice conversation started. I’m listening.');listen()}
function endConversation(){active=false;busy=false;recognition?.stop();if(currentAudio){currentAudio.pause();currentAudio=null}setState('idle','Voice conversation ended — text chat is still available')}
function listen(){if(!active||busy||listening||!recognition)return;try{recognition.start()}catch(e){}}

async function ask(message,fromVoice=true){const clean=(message||'').trim();if(!clean||busy)return;busy=true;recognition?.stop();addMessage('user',clean);setState('thinking','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:clean})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');addMessage('kuppa',data.message);if(fromVoice&&active){setState('speaking','Speaking…');await speak(data.message)}else{setState('idle','Ready')};await loadApprovals()}catch(e){addMessage('kuppa',e.message);setState('idle','Conversation error')}finally{busy=false;if(active)setTimeout(listen,350);else textInput.focus()}}
async function speak(text){const r=await fetch('/api/voice/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let detail='';try{detail=(await r.json()).error||''}catch(e){}voiceStatus.textContent='KUPPA neural voice offline';voiceDot.classList.add('offline');throw new Error(detail||'KUPPA neural voice engine is offline.')}const blob=await r.blob(),url=URL.createObjectURL(blob);voiceStatus.textContent='KUPPA neural voice';voiceDot.classList.remove('offline');await new Promise((resolve,reject)=>{const a=new Audio(url);currentAudio=a;a.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;setState('idle','Ready');resolve()};a.onerror=()=>{URL.revokeObjectURL(url);currentAudio=null;reject(new Error('KUPPA neural voice audio playback failed.'))};a.play().catch(reject)})}
async function loadApprovals(){try{const r=await fetch('/api/actions'),actions=await r.json(),pending=actions.filter(x=>x.status==='PENDING_APPROVAL');document.getElementById('approvals').innerHTML=pending.map(x=>`<div class="approval-card"><b>Approval needed</b><p>${esc(x.summary)}</p><button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join('')}catch(e){}}
async function decide(id,op){busy=true;recognition?.stop();try{await fetch(`/api/actions/${id}/${op}`,{method:'POST'});const line=op==='approve'?'Approved. I will wait for your explicit execution command.':'Rejected.';addMessage('kuppa',line);if(active){setState('speaking','Speaking…');await speak(line)}await loadApprovals()}finally{busy=false;if(active)setTimeout(listen,350)}}
function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
initAvatar();loadApprovals();textInput.focus();
</script></body></html>
